
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SimCore Neon City</title>
    <style>
        /* Base layout */
        body { 
            margin: 0; 
            padding: 0; 
            background: #050505; 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            overflow: hidden; 
            display: flex; 
            height: 100vh; 
        }
        
        /* Sidebar styling */
        #sidebar { 
            width: 280px; 
            min-width: 280px; 
            flex-shrink: 0; 
            height: 100%; 
            background: #0a0a0a; 
            border-right: 1px solid #333; 
            padding: 20px; 
            box-sizing: border-box; 
            overflow-y: auto; 
            z-index: 10; 
        }
        #sidebar h1 { 
            font-size: 20px; 
            color: #0ff; 
            text-shadow: 0 0 10px #0ff; 
            text-align: center; 
            margin-top: 0; 
            margin-bottom: 20px; 
        }
        .citizen-card { 
            background: #111; 
            border-radius: 8px; 
            padding: 10px; 
            margin-bottom: 10px; 
            border-left: 4px solid #555; 
            font-size: 13px; 
            transition: 0.3s; 
            box-shadow: 0 0 5px rgba(0,0,0,0.5); 
        }
        
        /* Map container (holds canvas, controls, and dialogs) */
        .map-container { 
            flex-grow: 1; 
            position: relative; 
            display: flex; 
        }
        canvas { 
            width: 100%; 
            height: 100%; 
            display: block; 
        }

        /* Player Controls */
        .controls { 
            position: absolute; 
            bottom: 20px; 
            left: 20px; 
            background: rgba(10,10,10,0.85); 
            padding: 15px; 
            border-radius: 10px; 
            border: 1px solid #0ff; 
            backdrop-filter: blur(5px); 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            z-index: 10; 
        }
        button { 
            background: #0ff; 
            color: #000; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 5px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 0 10px #0ff; 
            transition: 0.2s; 
        }
        button:hover { 
            background: #fff; 
            box-shadow: 0 0 20px #fff; 
        }
        input[type=range] { 
            width: 150px; 
            accent-color: #0ff; 
        }
        #day-display { 
            font-size: 18px; 
            font-weight: bold; 
            color: #f0f; 
            text-shadow: 0 0 10px #f0f; 
        }
        
        /* AI Dialog Box */
        .dialog-box { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            background: rgba(20,20,20,0.9); 
            border: 2px solid #0ff; 
            border-radius: 10px; 
            padding: 20px; 
            max-width: 400px; 
            box-shadow: 0 0 20px rgba(0,255,255,0.3); 
            display: block; 
            z-index: 100; 
            backdrop-filter: blur(10px); 
        }
        .dialog-box h3 { 
            margin-top: 0; 
            color: #0ff; 
            text-shadow: 0 0 5px #0ff; 
        }
        .dialog-box pre { 
            margin: 0; 
            color: #ddd; 
            font-family: monospace; 
            white-space: pre-wrap; 
            font-size: 14px; 
        }
    </style>
</head>
<body>
    <!-- Sidebar for stats -->
    <div id="sidebar">
        <h1>⚡ SIMCORE ⚡</h1>
        <div id="stats-container"></div>
    </div>
    
    <!-- Main Map Area -->
    <div class="map-container">
        <canvas id="cityCanvas"></canvas>
        
        <!-- Player Controls -->
        <div class="controls">
            <button id="playBtn">▶ Play</button>
            <span id="day-display">Day: 0</span>
            <input type="range" id="speedSlider" min="1" max="20" value="5">
            <span>Speed</span>
        </div>
        
        <!-- AI Dialog Overlay -->
        <div class="dialog-box">
            <h3>🤖 AI Event</h3>
            <pre id="dialog-text"></pre>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cityCanvas');
        const ctx = canvas.getContext('2d');
        const timelineData = [{"name": "Alex", "route": [{"Day": "1", "X": 300.0, "Y": 100.0, "Mood": 90.0, "Money": 950.0, "Health": 57.0, "MusicSkill": 20.0}, {"Day": "2", "X": 320.0, "Y": 120.0, "Mood": 104.0, "Money": 5850.0, "Health": 59.0, "MusicSkill": 20.0}, {"Day": "3", "X": 300.0, "Y": 100.0, "Mood": 100.0, "Money": 5800.0, "Health": 61.0, "MusicSkill": 20.0}]}, {"name": "Anna", "route": [{"Day": "1", "X": 320.0, "Y": 480.0, "Mood": 61.0, "Money": 6927.0, "Health": 99.0, "MusicSkill": 15.0}, {"Day": "2", "X": 340.0, "Y": 460.0, "Mood": 59.0, "Money": 12877.0, "Health": 100.0, "MusicSkill": 15.0}, {"Day": "3", "X": 320.0, "Y": 480.0, "Mood": 69.0, "Money": 12827.0, "Health": 100.0, "MusicSkill": 15.0}]}, {"name": "Artem", "route": [{"Day": "1", "X": 120.0, "Y": 120.0, "Mood": 72.0, "Money": 815.0, "Health": 99.0, "MusicSkill": 16.0}, {"Day": "2", "X": 140.0, "Y": 140.0, "Mood": 72.0, "Money": 7165.0, "Health": 100.0, "MusicSkill": 16.0}, {"Day": "3", "X": 160.0, "Y": 160.0, "Mood": 82.0, "Money": 7115.0, "Health": 100.0, "MusicSkill": 16.0}]}, {"name": "Dmitry", "route": [{"Day": "1", "X": 320.0, "Y": 480.0, "Mood": 90.0, "Money": 733.0, "Health": 93.0, "MusicSkill": 31.0}, {"Day": "2", "X": 340.0, "Y": 460.0, "Mood": 100.0, "Money": 683.0, "Health": 95.0, "MusicSkill": 31.0}, {"Day": "3", "X": 360.0, "Y": 440.0, "Mood": 100.0, "Money": 633.0, "Health": 97.0, "MusicSkill": 31.0}]}, {"name": "Elena", "route": [{"Day": "1", "X": 120.0, "Y": 120.0, "Mood": 77.0, "Money": 3682.0, "Health": 79.0, "MusicSkill": 33.0}, {"Day": "2", "X": 140.0, "Y": 140.0, "Mood": 77.0, "Money": 7232.0, "Health": 81.0, "MusicSkill": 33.0}, {"Day": "3", "X": 120.0, "Y": 120.0, "Mood": 87.0, "Money": 7182.0, "Health": 83.0, "MusicSkill": 33.0}]}, {"name": "Genry", "route": [{"Day": "1", "X": 120.0, "Y": 120.0, "Mood": 68.0, "Money": 6450.0, "Health": 87.0, "MusicSkill": 10.0}, {"Day": "2", "X": 140.0, "Y": 140.0, "Mood": 66.0, "Money": 12400.0, "Health": 89.0, "MusicSkill": 10.0}, {"Day": "3", "X": 120.0, "Y": 120.0, "Mood": 76.0, "Money": 12350.0, "Health": 91.0, "MusicSkill": 10.0}]}, {"name": "Ivan", "route": [{"Day": "1", "X": 320.0, "Y": 120.0, "Mood": 115.0, "Money": 109.0, "Health": 84.0, "MusicSkill": 27.0}, {"Day": "2", "X": 340.0, "Y": 140.0, "Mood": 100.0, "Money": 59.0, "Health": 86.0, "MusicSkill": 27.0}, {"Day": "3", "X": 320.0, "Y": 120.0, "Mood": 100.0, "Money": 9.0, "Health": 88.0, "MusicSkill": 27.0}]}, {"name": "Ksenia", "route": [{"Day": "1", "X": 120.0, "Y": 120.0, "Mood": 78.0, "Money": 5857.0, "Health": 52.0, "MusicSkill": 25.0}, {"Day": "2", "X": 140.0, "Y": 140.0, "Mood": 87.0, "Money": 10857.0, "Health": 54.0, "MusicSkill": 25.0}, {"Day": "3", "X": 160.0, "Y": 160.0, "Mood": 97.0, "Money": 10807.0, "Health": 56.0, "MusicSkill": 25.0}]}, {"name": "Max", "route": [{"Day": "1", "X": 120.0, "Y": 480.0, "Mood": 85.0, "Money": 47.0, "Health": 67.0, "MusicSkill": 42.0}, {"Day": "2", "X": 140.0, "Y": 460.0, "Mood": 85.0, "Money": 3197.0, "Health": 69.0, "MusicSkill": 42.0}, {"Day": "3", "X": 160.0, "Y": 440.0, "Mood": 95.0, "Money": 3147.0, "Health": 71.0, "MusicSkill": 42.0}]}, {"name": "Mia", "route": [{"Day": "1", "X": 120.0, "Y": 480.0, "Mood": 90.0, "Money": 6550.0, "Health": 100.0, "MusicSkill": 80.0}, {"Day": "2", "X": 100.0, "Y": 500.0, "Mood": 100.0, "Money": 6500.0, "Health": 100.0, "MusicSkill": 80.0}, {"Day": "3", "X": 120.0, "Y": 480.0, "Mood": 100.0, "Money": 6450.0, "Health": 90.0, "MusicSkill": 80.0}]}, {"name": "Pavel", "route": [{"Day": "1", "X": 300.0, "Y": 500.0, "Mood": 65.0, "Money": 497.0, "Health": 91.0, "MusicSkill": 11.0}, {"Day": "2", "X": 320.0, "Y": 480.0, "Mood": 65.0, "Money": 3647.0, "Health": 93.0, "MusicSkill": 11.0}, {"Day": "3", "X": 340.0, "Y": 460.0, "Mood": 75.0, "Money": 3597.0, "Health": 95.0, "MusicSkill": 11.0}]}, {"name": "Sofia", "route": [{"Day": "1", "X": 120.0, "Y": 480.0, "Mood": 86.0, "Money": 6430.0, "Health": 76.0, "MusicSkill": 46.0}, {"Day": "2", "X": 100.0, "Y": 500.0, "Mood": 96.0, "Money": 6380.0, "Health": 78.0, "MusicSkill": 46.0}, {"Day": "3", "X": 120.0, "Y": 480.0, "Mood": 79.0, "Money": 12280.0, "Health": 80.0, "MusicSkill": 46.0}]}, {"name": "Vika", "route": [{"Day": "1", "X": 320.0, "Y": 480.0, "Mood": 113.0, "Money": 940.0, "Health": 74.0, "MusicSkill": 18.0}, {"Day": "2", "X": 340.0, "Y": 460.0, "Mood": 110.0, "Money": 4590.0, "Health": 76.0, "MusicSkill": 18.0}, {"Day": "3", "X": 360.0, "Y": 440.0, "Mood": 100.0, "Money": 8140.0, "Health": 78.0, "MusicSkill": 18.0}]}];

        // Static map buildings (Must match C code coordinates)
        const homes = [{x: 100, y: 100}, {x: 300, y: 100}, {x: 100, y: 500}, {x: 300, y: 500}];
        const works = [{x: 700, y: 200}, {x: 700, y: 400}];
        const park = {x: 500, y: 300};

        // Resize canvas to fit its container
        function resize() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Initialize citizens with starting positions
        const citizens = timelineData.map(c => {
            const firstPos = c.route[0];
            return {
                name: c.name,
                route: c.route,
                x: firstPos.X,
                y: firstPos.Y,
                targetX: firstPos.X,
                targetY: firstPos.Y,
                color: '#fff'
            };
        });

        // Show AI text if available
        if ({"c1": "Elena", "c2": "Mia", "text": "Elena: I'm so glad I ran into you, Mia. I was starting to think I'd never run into anyone from my nan class.\nMia: Ah, sorry I haven't been in touch, Elena. I've been slammed with work and I totally lost track of time.\nElena: Yeah, it's okay. I know how it is. I've been stuck in a rut, too."}) {
            document.getElementById('dialog-text').innerText = {"c1": "Elena", "c2": "Mia", "text": "Elena: I'm so glad I ran into you, Mia. I was starting to think I'd never run into anyone from my nan class.\nMia: Ah, sorry I haven't been in touch, Elena. I've been slammed with work and I totally lost track of time.\nElena: Yeah, it's okay. I know how it is. I've been stuck in a rut, too."}.text;
        }

        // --- DRAWING FUNCTIONS ---
        function drawNeonRect(x, y, w, h, color) {
            ctx.fillStyle = 'rgba(10,10,10,0.8)';
            ctx.fillRect(x - w/2, y - h/2, w, h);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.shadowColor = color;
            ctx.shadowBlur = 15;
            ctx.strokeRect(x - w/2, y - h/2, w, h);
            ctx.shadowBlur = 0;
        }

        function drawCity() {
            // Background
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid
            ctx.strokeStyle = '#0a1a2a';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=50) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke(); }

            // Draw Buildings
            homes.forEach(h => drawNeonRect(h.x, h.y, 60, 60, '#0055ff')); // Blue Homes
            works.forEach(w => drawNeonRect(w.x, w.y, 100, 80, '#ff00ff')); // Purple Works
            drawNeonRect(park.x, park.y, 80, 80, '#00ff00'); // Green Park

            // Draw Citizens
            citizens.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, 12, 0, 2 * Math.PI);
                ctx.fillStyle = c.color;
                ctx.shadowColor = c.color;
                ctx.shadowBlur = 20;
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.fillStyle = '#fff';
                ctx.fillText(c.name, c.x, c.y - 20);
            });
        }

        // --- ANIMATION LOOP ---
        let dayIndex = 0;
        let isPlaying = false;
        let speed = 5;
        let lastTime = 0;
        let timeAccumulator = 0;

        document.getElementById('playBtn').addEventListener('click', (e) => {
            isPlaying = !isPlaying;
            e.target.innerText = isPlaying ? '⏸ Pause' : '▶ Play';
        });

        document.getElementById('speedSlider').addEventListener('input', (e) => {
            speed = parseInt(e.target.value);
        });

        function updateSidebar() {
            const statsContainer = document.getElementById('stats-container');
            statsContainer.innerHTML = '';
            citizens.forEach(c => {
                const pos = c.route[dayIndex];
                statsContainer.innerHTML += `
                    <div class="citizen-card" style="border-left-color: ${c.color}; box-shadow: 0 0 10px ${c.color}22;">
                        <b style="color: ${c.color}">${c.name}</b><br>
                        💰 ${pos.Money} | ❤️ ${pos.Health}<br>
                        😊 ${pos.Mood} | 🎵 ${pos.MusicSkill}
                    </div>
                `;
            });
        }

        function update(time) {
            const deltaTime = time - lastTime;
            lastTime = time;

            if (isPlaying) {
                timeAccumulator += deltaTime;
                // Time delay between days based on speed slider
                if (timeAccumulator > (1000 / speed)) {
                    timeAccumulator = 0;
                    dayIndex++;
                    
                    // Loop timeline
                    if (dayIndex >= citizens[0].route.length) dayIndex = 0; 

                    // Update target coordinates and colors
                    citizens.forEach(c => {
                        const pos = c.route[dayIndex];
                        c.targetX = pos.X;
                        c.targetY = pos.Y;
                        
                        let m = pos.Mood;
                        c.color = m > 70 ? '#00ffcc' : (m > 40 ? '#ffaa00' : '#ff0044');
                    });
                    
                    document.getElementById('day-display').innerText = 'Day: ' + citizens[0].route[dayIndex].Day;
                    updateSidebar();
                }
            }

            // Smooth movement (lerp)
            citizens.forEach(c => {
                c.x += (c.targetX - c.x) * 0.08; 
                c.y += (c.targetY - c.y) * 0.08;
            });

            drawCity();
            requestAnimationFrame(update);
        }

        // Start animation
        lastTime = performance.now();
        updateSidebar();
        requestAnimationFrame(update);
    </script>
</body>
</html>
