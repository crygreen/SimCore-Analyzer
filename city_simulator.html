
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SimCore City</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        /* Left Sidebar for Stats */
        .sidebar {
            width: 300px;
            background-color: #1e1e1e;
            padding: 20px;
            overflow-y: auto;
            border-right: 2px solid #333;
        }
        .sidebar h2 { color: #4CAF50; text-align: center; }
        .card {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            border-left: 5px solid #555;
        }
        /* Right area for Canvas */
        .map-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        canvas {
            background-color: #1a1a1a;
            border: 2px solid #333;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <!-- UI SIDEBAR -->
    <div class="sidebar">
        <h2>SimCore Day 37</h2>
        <div id="stats-container"></div>
    </div>

    <!-- CANVAS MAP -->
    <div class="map-area">
        <canvas id="cityCanvas" width="900" height="700"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('cityCanvas');
        const ctx = canvas.getContext('2d');
        
        const citizens = [{"name": "Genry", "money": 205, "health": 82, "mood": 90, "skill": 10, "home": {"x": 200, "y": 500}, "work": {"x": 600, "y": 400}, "x": 200, "y": 500, "state": "home", "timer": 0}, {"name": "Alex", "money": 906, "health": 71, "mood": 85, "skill": 22, "home": {"x": 100, "y": 500}, "work": {"x": 600, "y": 200}, "x": 100, "y": 500, "state": "home", "timer": 0}, {"name": "Mia", "money": 568, "health": 100, "mood": 60, "skill": 84, "home": {"x": 200, "y": 100}, "work": {"x": 600, "y": 400}, "x": 200, "y": 100, "state": "home", "timer": 0}, {"name": "Ivan", "money": 1275, "health": 78, "mood": 90, "skill": 32, "home": {"x": 300, "y": 500}, "work": {"x": 600, "y": 400}, "x": 300, "y": 500, "state": "home", "timer": 0}, {"name": "Elena", "money": 98, "health": 64, "mood": 100, "skill": 19, "home": {"x": 100, "y": 100}, "work": {"x": 600, "y": 200}, "x": 100, "y": 100, "state": "home", "timer": 0}, {"name": "Max", "money": 593, "health": 82, "mood": 86, "skill": 52, "home": {"x": 200, "y": 500}, "work": {"x": 600, "y": 200}, "x": 200, "y": 500, "state": "home", "timer": 0}, {"name": "Sofia", "money": 2098, "health": 100, "mood": 100, "skill": 76, "home": {"x": 100, "y": 100}, "work": {"x": 600, "y": 400}, "x": 100, "y": 100, "state": "home", "timer": 0}, {"name": "Dmitry", "money": 144, "health": 73, "mood": 100, "skill": 52, "home": {"x": 200, "y": 100}, "work": {"x": 600, "y": 400}, "x": 200, "y": 100, "state": "home", "timer": 0}, {"name": "Anna", "money": 526, "health": 74, "mood": 70, "skill": 74, "home": {"x": 300, "y": 500}, "work": {"x": 600, "y": 200}, "x": 300, "y": 500, "state": "home", "timer": 0}, {"name": "Pavel", "money": 1750, "health": 73, "mood": 67, "skill": 68, "home": {"x": 200, "y": 500}, "work": {"x": 600, "y": 200}, "x": 200, "y": 500, "state": "home", "timer": 0}, {"name": "Ksenia", "money": 103, "health": 58, "mood": 60, "skill": 12, "home": {"x": 200, "y": 100}, "work": {"x": 600, "y": 200}, "x": 200, "y": 100, "state": "home", "timer": 0}, {"name": "Artem", "money": 286, "health": 100, "mood": 100, "skill": 43, "home": {"x": 100, "y": 500}, "work": {"x": 600, "y": 400}, "x": 100, "y": 500, "state": "home", "timer": 0}, {"name": "Vika", "money": 1709, "health": 80, "mood": 40, "skill": 16, "home": {"x": 200, "y": 500}, "work": {"x": 600, "y": 400}, "x": 200, "y": 500, "state": "home", "timer": 0}];
        const houses = [{"x": 100, "y": 100}, {"x": 200, "y": 100}, {"x": 300, "y": 100}, {"x": 100, "y": 500}, {"x": 200, "y": 500}, {"x": 300, "y": 500}];
        const workplaces = [{"x": 600, "y": 200}, {"x": 600, "y": 400}];

        // --- 1. BUILD STATS UI ---
        const statsContainer = document.getElementById('stats-container');
        citizens.forEach(c => {
            let color = c.mood > 70 ? '#4CAF50' : (c.mood > 40 ? '#FF9800' : '#F44336');
            statsContainer.innerHTML += `
                <div class="card" style="border-left-color: ${color}">
                    <b>${c.name}</b><br>
                    💰 ${c.money} | ❤️ ${c.health}<br>
                    😊 ${c.mood} | 🎵 ${c.skill}
                </div>
            `;
        });

        // --- 2. DRAW MAP ENVIRONMENT ---
        function drawEnvironment() {
            // Draw Streets (Lines)
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 30;
            ctx.beginPath();
            ctx.moveTo(100, 300); ctx.lineTo(800, 300);
            ctx.moveTo(450, 0); ctx.lineTo(450, 700);
            ctx.stroke();

            // Draw Houses (Blue Squares)
            ctx.fillStyle = '#1E90FF';
            houses.forEach(h => {
                ctx.fillRect(h.x - 20, h.y - 20, 40, 40);
            });

            // Draw Workplaces (Purple Squares)
            ctx.fillStyle = '#8A2BE2';
            workplaces.forEach(w => {
                ctx.fillRect(w.x - 30, w.y - 30, 60, 60);
            });
        }

        // --- 3. LOGIC & ANIMATION ---
        function updateLogic(c) {
            let targetX = c.x;
            let targetY = c.y;

            if (c.state === "home") {
                c.timer++;
                if (c.timer > 60) { // Wait 1 sec (60 frames) then go to work
                    c.state = "going_to_work";
                    c.timer = 0;
                }
            } 
            else if (c.state === "going_to_work") {
                targetX = c.work.x;
                targetY = c.work.y;
                if (Math.hypot(c.x - targetX, c.y - targetY) < 5) {
                    c.state = "work";
                }
            } 
            else if (c.state === "work") {
                c.timer++;
                if (c.timer > 120) { // Wait 2 secs then go home
                    c.state = "going_home";
                    c.timer = 0;
                }
            } 
            else if (c.state === "going_home") {
                targetX = c.home.x;
                targetY = c.home.y;
                if (Math.hypot(c.x - targetX, c.y - targetY) < 5) {
                    c.state = "home";
                }
            }

            // Move towards target
            if (c.x !== targetX || c.y !== targetY) {
                let dx = targetX - c.x;
                let dy = targetY - c.y;
                let dist = Math.hypot(dx, dy);
                let speed = 2;
                c.x += (dx / dist) * speed;
                c.y += (dy / dist) * speed;
            }
        }

        function drawCitizens() {
            citizens.forEach(c => {
                // Body
                ctx.beginPath();
                ctx.arc(c.x, c.y, 12, 0, 2 * Math.PI);
                ctx.fillStyle = c.mood > 70 ? '#4CAF50' : (c.mood > 40 ? '#FF9800' : '#F44336');
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Name
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(c.name, c.x, c.y - 20);
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawEnvironment(); // Draw houses and roads
            citizens.forEach(c => updateLogic(c)); // Update positions
            drawCitizens(); // Draw people
            requestAnimationFrame(animate);
        }

        // Start animation
        animate();
    </script>
</body>
</html>
