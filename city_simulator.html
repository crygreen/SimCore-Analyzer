
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SimCore City</title>
    <style>
        body { background-color: #121212; color: white; font-family: Arial; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        .sidebar { width: 300px; background-color: #1e1e1e; padding: 20px; border-right: 2px solid #333; overflow-y: auto; }
        .card { background-color: #2a2a2a; border-radius: 8px; padding: 10px; margin-bottom: 10px; border-left: 5px solid #555; }
        .map-area { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        canvas { background-color: #1a1a1a; border: 2px solid #333; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* AI DIALOGUE BOX */
        .dialog-box {
            position: absolute;
            bottom: 30px;
            background: #2a2a2a;
            border: 2px solid #4CAF50;
            border-radius: 10px;
            padding: 20px;
            max-width: 600px;
            width: 80%;
            display: block;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
            z-index: 10;
        }
        .dialog-box h3 { margin-top: 0; color: #4CAF50; }
        .dialog-box pre { margin: 0; color: #ddd; font-family: monospace; white-space: pre-wrap; font-size: 14px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>SimCore Day 88</h2>
        <div id="stats-container"></div>
    </div>
    <div class="map-area">
        <canvas id="cityCanvas" width="900" height="700"></canvas>
        
        <!-- DIALOGUE OVERLAY -->
        <div class="dialog-box">
            <h3>🤖 AI Event: Street Encounter</h3>
            <pre id="dialog-text"></pre>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cityCanvas');
        const ctx = canvas.getContext('2d');
        const citizens = [{"name": "Genry", "money": 54, "health": 100, "mood": 85, "skill": 23, "x": 20, "y": 20}, {"name": "Alex", "money": 296, "health": 78, "mood": 100, "skill": 51, "x": 180, "y": 180}, {"name": "Mia", "money": 13828, "health": 100, "mood": 85, "skill": 100, "x": 240, "y": 240}, {"name": "Ivan", "money": 1145, "health": 100, "mood": 100, "skill": 31, "x": 443, "y": 424}, {"name": "Elena", "money": 54, "health": 83, "mood": 50, "skill": 11, "x": 499, "y": 356}, {"name": "Max", "money": 973, "health": 100, "mood": 20, "skill": 23, "x": 470, "y": 415}, {"name": "Sofia", "money": 21823, "health": 100, "mood": 100, "skill": 100, "x": 416, "y": 354}, {"name": "Dmitry", "money": 12512, "health": 79, "mood": 100, "skill": 85, "x": 533, "y": 337}, {"name": "Anna", "money": 18421, "health": 94, "mood": 100, "skill": 100, "x": 465, "y": 444}, {"name": "Pavel", "money": 22508, "health": 92, "mood": 100, "skill": 100, "x": 518, "y": 239}, {"name": "Ksenia", "money": 39850, "health": 100, "mood": 100, "skill": 100, "x": 677, "y": 411}, {"name": "Artem", "money": 11915, "health": 100, "mood": 100, "skill": 89, "x": 524, "y": 290}, {"name": "Vika", "money": 17224, "health": 95, "mood": 100, "skill": 96, "x": 472, "y": 274}];
        const dialogData = {"c1": "Ivan", "c2": "Max", "text": "\"Ivan: \"Hey, nice day, huh?\"\nMax: \"Yeah, can't complain... at least I'm not broke like you.\"\nIvan: \"Hey, my wallet is fine, thanks.\"\n\nRelDelta: -2"};

        // Build Sidebar
        const statsContainer = document.getElementById('stats-container');
        citizens.forEach(c => {
            let color = c.mood > 70 ? '#4CAF50' : (c.mood > 40 ? '#FF9800' : '#F44336');
            statsContainer.innerHTML += `<div class="card" style="border-left-color: ${color}"><b>${c.name}</b><br>💰 ${c.money} | ❤️ ${c.health}</div>`;
        });

        // Show Dialogue text
        if (dialogData) {
            document.getElementById('dialog-text').innerText = dialogData.text;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Environment
            ctx.strokeStyle = '#333'; ctx.lineWidth = 30;
            ctx.beginPath(); ctx.moveTo(0, 350); ctx.lineTo(900, 350); ctx.moveTo(450, 0); ctx.lineTo(450, 700); ctx.stroke();
            
            // Draw Houses and Workplaces
            ctx.fillStyle = '#1E90FF';
            [[100, 100], [200, 100], [300, 100], [100, 500], [200, 500], [300, 500]].forEach(h => ctx.fillRect(h[0]-20, h[1]-20, 40, 40));
            ctx.fillStyle = '#8A2BE2';
            [[600, 200], [600, 400]].forEach(w => ctx.fillRect(w[0]-30, w[1]-30, 60, 60));
            
            // Draw Citizens
            citizens.forEach(c => {
                // Determine color safely
                let circleColor = '#FFFFFF';
                if (c.mood !== undefined) {
                    if (c.mood > 70) circleColor = '#4CAF50';
                    else if (c.mood > 40) circleColor = '#FF9800';
                    else circleColor = '#F44336';
                }

                // Draw Body
                ctx.beginPath(); 
                ctx.arc(c.x, c.y, 15, 0, 2 * Math.PI);
                ctx.fillStyle = circleColor;
                ctx.fill(); 
                ctx.strokeStyle = '#fff'; 
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Draw Name (with black outline for readability)
                ctx.font = 'bold 14px Arial'; 
                ctx.textAlign = 'center';
                
                // Text outline
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 4;
                ctx.strokeText(c.name, c.x, c.y - 22);
                
                // Text fill
                ctx.fillStyle = '#fff'; 
                ctx.fillText(c.name, c.x, c.y - 22);
            });
        }
        draw();
    </script>
</body>
</html>
