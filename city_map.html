
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SimCore City Map - Animated</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #4CAF50; }
        canvas {
            background-color: #2a2a2a;
            border: 2px solid #555;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <h1>SimCore City Map - Day 37</h1>
    <canvas id="cityCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('cityCanvas');
        const ctx = canvas.getContext('2d');
        const citizens = [{"name": "Genry", "money": 205, "mood": 90, "x": 155, "y": 69, "vx": 1.6184809511854088, "vy": -1.3496552356080862}, {"name": "Alex", "money": 906, "mood": 85, "x": 399, "y": 499, "vx": -0.9340771310588344, "vy": -1.2310952753299935}, {"name": "Mia", "money": 568, "mood": 60, "x": 702, "y": 350, "vx": 1.074837956864267, "vy": 1.063433938691356}, {"name": "Ivan", "money": 1275, "mood": 90, "x": 423, "y": 392, "vx": 0.886991267310508, "vy": 0.5334290748848377}, {"name": "Elena", "money": 98, "mood": 100, "x": 660, "y": 164, "vx": -1.3570649992610333, "vy": -1.6201403370812153}, {"name": "Max", "money": 593, "mood": 86, "x": 561, "y": 357, "vx": 0.8592145085532044, "vy": -1.3593756537344723}, {"name": "Sofia", "money": 2098, "mood": 100, "x": 374, "y": 80, "vx": -0.9115846955816791, "vy": -1.1985403651689426}, {"name": "Dmitry", "money": 144, "mood": 100, "x": 606, "y": 528, "vx": -0.7240062598819328, "vy": 1.9863034983244858}, {"name": "Anna", "money": 526, "mood": 70, "x": 341, "y": 333, "vx": -1.4811669735616755, "vy": 1.215221483882918}, {"name": "Pavel", "money": 1750, "mood": 67, "x": 698, "y": 262, "vx": -1.4160656106591651, "vy": 1.029638453967839}, {"name": "Ksenia", "money": 103, "mood": 60, "x": 53, "y": 431, "vx": 0.9572551130244131, "vy": 1.0969781307824662}, {"name": "Artem", "money": 286, "mood": 100, "x": 131, "y": 227, "vx": 0.7577912502725107, "vy": 1.686976176886243}, {"name": "Vika", "money": 1709, "mood": 40, "x": 214, "y": 496, "vx": -1.1280217197507414, "vy": -0.982797239174857}];

        function getMoodColor(mood) {
            if (mood > 70) return '#4CAF50'; // Green (Happy)
            if (mood > 40) return '#FF9800'; // Orange (Neutral)
            return '#F44336'; // Red (Sad)
        }

        // --- ANIMATION LOGIC ---
        function updatePositions() {
            citizens.forEach(c => {
                // Move citizen
                c.x += c.vx;
                c.y += c.vy;

                // Bounce off walls (X-axis)
                if (c.x < 20 || c.x > canvas.width - 20) {
                    c.vx *= -1;
                }
                // Bounce off walls (Y-axis)
                if (c.y < 20 || c.y > canvas.height - 20) {
                    c.vy *= -1;
                }
            });
        }

        function drawCity() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            citizens.forEach(c => {
                // Draw Citizen (Circle)
                ctx.beginPath();
                ctx.arc(c.x, c.y, 15, 0, 2 * Math.PI);
                ctx.fillStyle = getMoodColor(c.mood);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw Name
                ctx.fillStyle = '#fff';
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(c.name, c.x, c.y - 25);
                
                // Draw Money
                ctx.fillStyle = '#ffd700';
                ctx.font = '12px Arial';
                ctx.fillText('$' + c.money, c.x, c.y + 30);
            });
        }

        // Main Animation Loop
        function animate() {
            updatePositions(); // 1. Update coordinates
            drawCity();        // 2. Draw everything again
            requestAnimationFrame(animate); // 3. Loop this function 60 times/sec
        }

        // Start the game
        animate();
    </script>
</body>
</html>
